<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Mairawberry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Tela de Menu Inicial (Capa) -->
        <div id="menu-screen">
            <button id="btn-jogar" onclick="iniciarJogoDoMenu()">TOQUE PARA JOGAR</button>
        </div>

        <!-- Tela do Jogo (Canvas) -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- Placar e HUD -->
        <div id="hud" class="hidden">
            <div id="score">🏆 0 m</div>
            <div id="coins">🪙 0</div>
            <div id="high-score">⭐ Recorde: 0 m</div>
        </div>

        <!-- Tela de Game Over Integrada com a Moldura -->
        <div id="game-over-screen" class="hidden">
            <div id="game-over-hud">
                <div id="final-score">0 m</div>
                <div id="final-coins">0</div>
            </div>
            
            <div id="game-over-buttons">
                <button onclick="reiniciarJogo()" id="btn-tentar">TENTAR NOVAMENTE</button>
                <button onclick="voltarAoMenu()" id="btn-menu">MENU INICIAL</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
